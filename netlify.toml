[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache for static assets, short for HTML so new posts appear fast
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Force trailing-slash URLs so each page has exactly one canonical address
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
